<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sổ Truyện</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Truyện">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: one-screen notebook — thin top bar, one scrolling column ~40em wide, the editor fills the screen */
:root{
  --bg:#F3F4F6; --paper:#FFFFFF; --ink:#1A2133; --muted:#5D6578; --line:#DDE0E7;
  --accent:#27407A; --accent-soft:#E3E8F4; --danger:#A3322B; --ok:#2F6B4A;
  --f-display: ui-serif, "New York", "Iowan Old Style", Georgia, "Noto Serif", serif;
  --f-body: ui-serif, "New York", "Iowan Old Style", Georgia, "Noto Serif", serif;
  --f-ui: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11141B;--paper:#181C25;--ink:#E4E7EE;--muted:#9AA2B4;--line:#2A3040;
  --accent:#9DB2EA;--accent-soft:#232C42;--danger:#E58A82;--ok:#8BC9A4;color-scheme:dark}}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:52px;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--bg)}
.bar .grow{flex:1;min-width:0}
.brand{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;padding-left:6px}
.brand i{color:var(--accent);font-style:italic}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;background:transparent;border-radius:10px;color:var(--ink)}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn svg{width:22px;height:22px}
.status{font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="saved"] .dot{background:var(--ok)}
.status[data-s="saving"] .dot{background:var(--accent)}
.status[data-s="error"] .dot{background:var(--danger)}
.status[data-s="error"]{color:var(--danger)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.col{max-width:40em;margin:0 auto;padding-top:22px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13.5px;margin:0}

.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  background:var(--accent);color:var(--paper);font-weight:600;padding:12px 18px;min-height:48px}
.primary:disabled{opacity:.6}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 13px;font-size:14px;min-height:42px}
.ghost:active{border-color:var(--accent)}
.ghost.danger{color:var(--danger)}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;min-height:64px}
.item:active{background:var(--accent-soft)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-family:var(--f-display);font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .num{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:15px;width:2.2em;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.item .chev{color:var(--muted);flex:0 0 auto}

.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--paper)}
.empty p{margin:0;color:var(--muted);max-width:28em}
.empty .big{font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--ink)}

.title-input{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.25;padding:2px 0}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.box p{margin:0}
.box.danger{border-color:var(--danger)}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0}

/* lock + forms */
.lock-mark{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.lock-mark svg{width:26px;height:26px}
.form{display:flex;flex-direction:column;gap:14px;max-width:26em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:16px;min-height:48px}
.field input:focus{outline:none;border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.notice{border:1px solid var(--danger);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.notice strong{color:var(--danger)}
.notice .check{color:var(--ink)}
.err{margin:0;color:var(--danger);font-size:14px}

/* utilities */
.stack-4{display:flex;flex-direction:column;gap:4px}
.stack-6{display:flex;flex-direction:column;gap:6px}
.stack-8{display:flex;flex-direction:column;gap:8px}
.row.between{justify-content:space-between}
.row.tight{gap:0;flex-wrap:nowrap}
.iconbtn.sm{width:38px;height:38px}
.iconbtn.sm svg{width:18px;height:18px}
.iconbtn:disabled{opacity:.3}
.iconbtn.danger{color:var(--danger)}
.item.static{cursor:default}
.item.static:active{background:transparent}
.item .snip{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 12px;min-height:46px;color:var(--muted)}
.search svg{width:18px;height:18px;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;color:var(--ink)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
details.notes{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.notes summary{padding:12px 14px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.notes[open] summary::before{transform:rotate(90deg)}
details.notes textarea{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;font-family:var(--f-body);font-size:16px;line-height:1.6;resize:vertical;border-radius:0 0 12px 12px}
details.notes textarea:focus{outline:none}
.bar-title{font-family:var(--f-display);font-style:italic;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* story text: the same look while writing and reading */
.prose{font-family:var(--f-body);font-size:var(--fs,18px);line-height:1.75;overflow-wrap:break-word}
.prose p{margin:0 0 .9em}
.prose h3{font-family:var(--f-display);font-size:1.2em;line-height:1.35;margin:1.3em 0 .6em}
.prose blockquote{margin:0 0 .9em;padding-left:14px;border-left:3px solid var(--line);font-style:italic;color:var(--muted)}
.prose hr{border:0;height:auto;margin:1.4em 0;text-align:center;overflow:visible}
.prose hr::after{content:"⁂";color:var(--muted);font-size:1.1em}
.prose figure.img{margin:1.2em auto;text-align:center;position:relative;max-width:100%}
.prose figure.img[data-size="s"]{width:42%}
.prose figure.img[data-size="m"]{width:70%}
.prose figure.img[data-size="l"]{width:100%}
.prose figure.img img{display:block;width:100%;height:auto;border-radius:8px;background:var(--accent-soft);min-height:40px}
.prose figure.img figcaption{font-family:var(--f-ui);font-size:.72em;line-height:1.4;color:var(--muted);font-style:italic;margin-top:6px;outline:none;min-height:1.2em}
.prose figure.img.missing img{display:none}
.prose figure.img.missing::before{content:"Ảnh này không còn trên máy";display:block;padding:24px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.75em}

/* editor */
main.editing{display:flex;flex-direction:column;overflow:hidden}
.editor{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.ed-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ed-inner{max-width:40em;margin:0 auto;padding-top:14px;padding-bottom:40vh;
  padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
.ed-story{font-size:12px;color:var(--muted);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-title{width:100%;border:0;background:transparent;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:21px;padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ch-title:focus{outline:none;border-bottom-color:var(--accent)}
.ch-title::placeholder{color:var(--muted);opacity:.7}
#body{outline:none;min-height:50vh;-webkit-user-select:text;user-select:text}
#body.isEmpty > p:first-child::before{content:"Bắt đầu viết ở đây…";color:var(--muted);opacity:.7;pointer-events:none}
#body figure.img{-webkit-user-select:none;user-select:none}
#body figure.img figcaption{-webkit-user-select:text;user-select:text}
#body figure.img figcaption:empty::before{content:attr(data-ph);opacity:.6}
#body figure.sel img{outline:3px solid var(--accent);outline-offset:2px}
.figbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:2;font-family:var(--f-ui);font-size:13px;white-space:nowrap}
.figbar button{border:0;background:transparent;color:var(--bg);min-width:38px;height:36px;border-radius:8px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center}
.figbar button.on{background:var(--accent);color:var(--paper)}
.figbar button.danger{color:#F2A49C}
.figbar svg{width:17px;height:17px}
.tb{flex:0 0 auto;display:flex;align-items:center;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid var(--line);background:var(--bg);
  padding-top:4px;padding-bottom:max(4px, env(safe-area-inset-bottom,0px));
  padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
body.kb .tb{padding-bottom:4px}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:0 0 auto;width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px}
.tb button svg{width:21px;height:21px}
.tb button.on{background:var(--accent-soft);color:var(--accent)}
.tb button.accent{color:var(--accent)}
.tb button:active{background:var(--accent-soft)}
.tb .glyph{font-size:18px;line-height:1}
.tb .glyph.sm{font-size:15px}
.tb .sep{flex:0 0 1px;align-self:stretch;margin:8px 4px;background:var(--line)}
.status #wc{font-variant-numeric:tabular-nums}

/* reading */
.read{gap:0}
.read-head{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.read-head h1{font-size:30px}
.read-ch{padding:18px 0 26px;border-bottom:1px solid var(--line)}
.read-ch h2{font-style:italic;font-size:22px;margin:0 0 16px}
.read-ch h2 .num{color:var(--accent)}
.read-ch .linkbtn{margin-top:4px;font-size:13px}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:18px;padding:40px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* hides content in the iPhone app switcher */
.shield{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:20px}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="brand grow">Sổ <i>Truyện</i></div></div>
<main id="main"><div class="loading">Đang mở sổ…</div></main>
<div class="toast" id="toast" hidden></div>
<div class="shield" id="shield" hidden>Sổ Truyện</div>
<noscript><p style="padding:20px">Cần bật JavaScript để dùng Sổ Truyện.</p></noscript>
<script src="app.js"></script>
</body>
</html>
