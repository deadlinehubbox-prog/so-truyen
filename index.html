<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sổ Truyện</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Truyện">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: one-screen notebook — thin top bar, one scrolling column ~40em wide, the editor fills the screen */
:root{
  --bg:#F3F4F6; --paper:#FFFFFF; --ink:#1A2133; --muted:#5D6578; --line:#DDE0E7;
  --accent:#27407A; --accent-soft:#E3E8F4; --danger:#A3322B; --ok:#2F6B4A;
  --f-display: ui-serif, "New York", Cambria, "Noto Serif", "Times New Roman", serif;
  --f-body: ui-serif, "New York", Cambria, "Noto Serif", "Times New Roman", serif;
  --f-ui: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11141B;--paper:#181C25;--ink:#E4E7EE;--muted:#9AA2B4;--line:#2A3040;
  --accent:#9DB2EA;--accent-soft:#232C42;--danger:#E58A82;--ok:#8BC9A4;color-scheme:dark}}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);font-size:calc(16px * var(--ui, 1))}
@media (min-width: 900px){
  html{font-size:calc(clamp(18px, 0.55vw + 10px, 24px) * var(--ui, 1))}
  .col,.ed-inner{max-width:46em}
  .tb{justify-content:center}
}
body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:0.9375rem;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:0.375rem}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:0.5rem;min-height:3.25rem;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(0.625rem, env(safe-area-inset-left,0px));padding-right:max(0.625rem, env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--bg)}
.bar .grow{flex:1;min-width:0}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;padding-left:0.375rem}
.brand i{color:var(--accent);font-style:italic}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:2.625rem;height:2.625rem;border:0;background:transparent;border-radius:0.625rem;color:var(--ink)}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn svg{width:1.375rem;height:1.375rem}
.status{font-size:0.7812rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:0.375rem}
.dot{width:0.4375rem;height:0.4375rem;border-radius:50%;background:var(--muted)}
.status[data-s="saved"] .dot{background:var(--ok)}
.status[data-s="saving"] .dot{background:var(--accent)}
.status[data-s="error"] .dot{background:var(--danger)}
.status[data-s="error"]{color:var(--danger)}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.col{max-width:40em;margin:0 auto;padding-top:1.375rem;padding-bottom:calc(2.5rem + env(safe-area-inset-bottom,0px));
  padding-left:max(1rem, env(safe-area-inset-left,0px));padding-right:max(1rem, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:1.125rem}
h1{font-family:var(--f-display);font-weight:600;font-size:1.625rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1875rem;margin:0}
.eyebrow{font-size:0.7188rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:0.8438rem;margin:0}

.primary{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;border:0;border-radius:0.75rem;
  background:var(--accent);color:var(--paper);font-weight:600;padding:0.75rem 1.125rem;min-height:3rem}
.primary:disabled{opacity:.6}
.ghost{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid var(--line);background:transparent;border-radius:0.625rem;padding:0.5625rem 0.8125rem;font-size:0.875rem;min-height:2.625rem}
.ghost:active{border-color:var(--accent)}
.ghost.danger{color:var(--danger)}
.ghost svg,.primary svg{width:1.15em;height:1.15em;flex:0 0 auto}
.ghost,.primary{white-space:nowrap}
.seg .ghost.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;padding:0.375rem 0;color:var(--accent);font-size:0.875rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.row{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:0.75rem;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0.875rem 0.25rem;min-height:4rem}
.item:active{background:var(--accent-soft)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-family:var(--f-display);font-size:1.125rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:0.7812rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item .num{font-family:var(--f-display);font-style:italic;color:var(--accent);font-size:0.9375rem;width:2.2em;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
.item .chev{color:var(--muted);flex:0 0 auto}

.empty{border:1px dashed var(--line);border-radius:0.875rem;padding:1.75rem 1.25rem;text-align:center;display:flex;flex-direction:column;gap:0.625rem;align-items:center;background:var(--paper)}
.empty p{margin:0;color:var(--muted);max-width:28em}
.empty .big{font-family:var(--f-display);font-style:italic;font-size:1.3125rem;color:var(--ink)}

.title-input{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--f-display);font-weight:600;font-size:1.625rem;line-height:1.25;padding:2px 0}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.box{border:1px solid var(--line);border-radius:0.75rem;padding:0.875rem;display:flex;flex-direction:column;gap:0.625rem;background:var(--paper)}
.box p{margin:0}
.box.danger{border-color:var(--danger)}
.note{font-size:0.7812rem;color:var(--muted);border-left:2px solid var(--line);padding-left:0.625rem;margin:0}

/* lock + forms */
.lock-mark{width:3.25rem;height:3.25rem;border-radius:0.875rem;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.lock-mark svg{width:1.625rem;height:1.625rem}
.form{display:flex;flex-direction:column;gap:0.875rem;max-width:26em}
.field{display:flex;flex-direction:column;gap:0.375rem}
.field label{font-size:0.8125rem;font-weight:500}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:0.625rem;padding:0.6875rem 0.75rem;font-size:1rem;min-height:3rem}
.field input:focus{outline:none;border-color:var(--accent)}
.check{display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:var(--muted)}
.check input{width:1.25rem;height:1.25rem;accent-color:var(--accent);flex:0 0 auto}
.notice{border:1px solid var(--danger);border-radius:0.75rem;padding:0.75rem 0.875rem;font-size:0.875rem;display:flex;flex-direction:column;gap:0.625rem;background:var(--paper)}
.notice strong{color:var(--danger)}
.notice .check{color:var(--ink)}
.err{margin:0;color:var(--danger);font-size:0.875rem}

/* utilities */
.stack-4{display:flex;flex-direction:column;gap:0.25rem}
.stack-6{display:flex;flex-direction:column;gap:0.375rem}
.stack-8{display:flex;flex-direction:column;gap:0.5rem}
.row.between{justify-content:space-between}
.row.tight{gap:0;flex-wrap:nowrap}
.iconbtn.sm{width:2.375rem;height:2.375rem}
.iconbtn.sm svg{width:1.125rem;height:1.125rem}
.iconbtn:disabled{opacity:.3}
.iconbtn.danger{color:var(--danger)}
.item.static{cursor:default}
.item.static:active{background:transparent}
.item .snip{font-size:0.875rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.search{display:flex;align-items:center;gap:0.5rem;border:1px solid var(--line);border-radius:0.75rem;background:var(--paper);padding:0 0.75rem;min-height:2.875rem;color:var(--muted)}
.search svg{width:1.125rem;height:1.125rem;flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:1rem;padding:0.625rem 0;color:var(--ink)}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent)}
details.notes{border:1px solid var(--line);border-radius:0.75rem;background:var(--paper)}
details.notes summary{padding:0.75rem 0.875rem;cursor:pointer;font-weight:500;display:flex;gap:0.5rem;align-items:baseline;flex-wrap:wrap;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.notes[open] summary::before{transform:rotate(90deg)}
details.notes textarea{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:0.75rem 0.875rem;font-family:var(--f-body);font-size:1rem;line-height:1.6;resize:vertical;border-radius:0 0 0.75rem 0.75rem}
details.notes textarea:focus{outline:none}
.bar-title{font-family:var(--f-display);font-style:italic;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

/* story text: the same look while writing and reading */
.prose{font-family:var(--f-body);font-size:var(--fs,1.125rem);line-height:1.75;overflow-wrap:break-word}
.prose p{margin:0 0 .9em}
.prose h3{font-family:var(--f-display);font-size:1.2em;line-height:1.35;margin:1.3em 0 .6em}
.prose blockquote{margin:0 0 .9em;padding-left:0.875rem;border-left:3px solid var(--line);font-style:italic;color:var(--muted)}
.prose hr{border:0;height:auto;margin:1.4em 0;text-align:center;overflow:visible}
.prose hr::after{content:"⁂";color:var(--muted);font-size:1.1em}
.prose figure.img{margin:1.2em auto;text-align:center;position:relative;max-width:100%}
.prose figure.img[data-size="s"]{width:42%}
.prose figure.img[data-size="m"]{width:70%}
.prose figure.img[data-size="l"]{width:100%}
.prose figure.img img{display:block;width:100%;height:auto;border-radius:0.5rem;background:var(--accent-soft);min-height:2.5rem}
.prose figure.img figcaption{font-family:var(--f-ui);font-size:.72em;line-height:1.4;color:var(--muted);font-style:italic;margin-top:0.375rem;outline:none;min-height:1.2em}
.prose figure.img.missing img{display:none}
.prose figure.img.missing::before{content:"Ảnh này không còn trên máy";display:block;padding:1.5rem 0.75rem;border:1px dashed var(--line);border-radius:0.5rem;color:var(--muted);font-size:.75em}

/* editor */
main.editing{display:flex;flex-direction:column;overflow:hidden}
.editor{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.ed-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ed-inner{max-width:40em;margin:0 auto;padding-top:0.875rem;padding-bottom:40vh;
  padding-left:max(1.125rem, env(safe-area-inset-left,0px));padding-right:max(1.125rem, env(safe-area-inset-right,0px))}
.ed-story{font-size:0.75rem;color:var(--muted);letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-title{width:100%;border:0;background:transparent;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.3125rem;padding:0.25rem 0 0.5rem;border-bottom:1px solid var(--line);margin-bottom:0.875rem}
.ch-title:focus{outline:none;border-bottom-color:var(--accent)}
.ch-title::placeholder{color:var(--muted);opacity:.7}
#body{outline:none;min-height:50vh;-webkit-user-select:text;user-select:text}
#body.isEmpty > p:first-child::before{content:"Bắt đầu viết ở đây…";color:var(--muted);opacity:.7;pointer-events:none}
#body figure.img{-webkit-user-select:none;user-select:none}
#body figure.img figcaption{-webkit-user-select:text;user-select:text}
#body figure.img figcaption:empty::before{content:attr(data-ph);opacity:.6}
#body figure.sel img{outline:3px solid var(--accent);outline-offset:2px}
.figbar{position:absolute;left:50%;top:0.5rem;transform:translateX(-50%);display:flex;gap:2px;padding:0.25rem;border-radius:0.75rem;background:var(--ink);box-shadow:0 0.25rem 1.125rem rgba(0,0,0,.25);z-index:2;font-family:var(--f-ui);font-size:0.8125rem;white-space:nowrap}
.figbar button{border:0;background:transparent;color:var(--bg);min-width:2.375rem;height:2.25rem;border-radius:0.5rem;padding:0 0.5rem;display:inline-flex;align-items:center;justify-content:center}
.figbar button.on{background:var(--accent);color:var(--paper)}
.figbar button.danger{color:#F2A49C}
.figbar svg{width:1.0625rem;height:1.0625rem}
.tb{flex:0 0 auto;display:flex;align-items:center;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid var(--line);background:var(--bg);
  padding-top:0.25rem;padding-bottom:max(0.25rem, env(safe-area-inset-bottom,0px));
  padding-left:max(0.5rem, env(safe-area-inset-left,0px));padding-right:max(0.5rem, env(safe-area-inset-right,0px))}
body.kb .tb{padding-bottom:0.25rem}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:0 0 auto;width:2.625rem;height:2.625rem;border:0;border-radius:0.625rem;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1.125rem}
.tb button svg{width:1.3125rem;height:1.3125rem}
.tb button.on{background:var(--accent-soft);color:var(--accent)}
.tb button.accent{color:var(--accent)}
.tb button:active{background:var(--accent-soft)}
.tb .glyph{font-size:1.125rem;line-height:1}
.tb .glyph.sm{font-size:0.9375rem}
.tb .sep{flex:0 0 1px;align-self:stretch;margin:0.5rem 0.25rem;background:var(--line)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.iconbtn.spin svg{animation-duration:3s}}
.iconbtn.bad{color:var(--danger)}
.status #wc{font-variant-numeric:tabular-nums}

/* reading */
.read{gap:0}
.read-head{padding-bottom:0.625rem;border-bottom:1px solid var(--line);margin-bottom:0.5rem}
.read-head h1{font-size:1.875rem}
.read-ch{padding:1.125rem 0 1.625rem;border-bottom:1px solid var(--line)}
.read-ch h2{font-style:italic;font-size:1.375rem;margin:0 0 1rem}
.read-ch h2 .num{color:var(--accent)}
.read-ch .linkbtn{margin-top:0.25rem;font-size:0.8125rem}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:1.125rem;padding:2.5rem 1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:0.5625rem 1rem;border-radius:0.625rem;font-size:0.875rem;z-index:20;max-width:calc(100% - 2rem)}
/* hides content in the iPhone app switcher */
.shield{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:1.25rem}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="brand grow">Sổ <i>Truyện</i></div></div>
<main id="main"><div class="loading">Đang mở sổ…</div></main>
<div class="toast" id="toast" hidden></div>
<div class="shield" id="shield" hidden>Sổ Truyện</div>
<noscript><p style="padding:20px">Cần bật JavaScript để dùng Sổ Truyện.</p></noscript>
<script src="app.js"></script>
</body>
</html>
